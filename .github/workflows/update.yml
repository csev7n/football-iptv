name: Update IPTV

on:
  workflow_dispatch:

  schedule:
    # Chạy mỗi 30 phút
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # ==================================================
      # PLAYWRIGHT
      # ==================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ==================================================
      # SCRAPER
      # ==================================================

      - name: Run scraper
        run: |
          echo "======================================"
          echo "START SCRAPER"
          echo "======================================"

          python scraper.py


      # ==================================================
      # CHECK JSON
      # ==================================================

      - name: Check matches.json
        run: |
          echo "======================================"
          echo "CHECK matches.json"
          echo "======================================"

          if [ ! -f matches.json ]; then
            echo "ERROR: matches.json not found"
            exit 1
          fi

          ls -lh matches.json


      # ==================================================
      # PLAYLIST
      # ==================================================

      - name: Build playlist
        run: |
          echo "======================================"
          echo "BUILD PLAYLIST"
          echo "======================================"

          python playlist.py


      # ==================================================
      # CHECK PLAYLIST
      # ==================================================

      - name: Check playlist.m3u
        run: |
          echo "======================================"
          echo "CHECK playlist.m3u"
          echo "======================================"

          if [ ! -f playlist.m3u ]; then
            echo "ERROR: playlist.m3u not found"
            exit 1
          fi

          ls -lh playlist.m3u

          echo ""
          echo "First 20 lines:"
          head -n 20 playlist.m3u


      # ==================================================
      # GIT COMMIT
      # ==================================================

      - name: Commit changes
        id: commit
        run: |
          echo "======================================"
          echo "COMMIT CHANGES"
          echo "======================================"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json
          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update IPTV playlist"
            git push

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes pushed successfully."
          fi


      # ==================================================
      # TRIGGER PUBLISH WORKFLOW
      # ==================================================

      - name: Trigger Publish IPTV
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          echo "======================================"
          echo "TRIGGER PUBLISH IPTV"
          echo "======================================"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"

          echo ""
          echo "Publish workflow triggered successfully."
