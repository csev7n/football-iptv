name: Publish IPTV Playlist

on:
  push:
    paths:
      - 'playlist.m3u'

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Check and publish playlist
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/csev7n/xoilacz-iptv/contents/playlist.m3u"

          echo "Downloading current public playlist..."

          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")

          SHA=$(echo "$RESPONSE" | jq -r '.sha // empty')

          PUBLIC_CONTENT=$(
            echo "$RESPONSE" |
            jq -r '.content // empty' |
            tr -d '\n' |
            base64 -d 2>/dev/null || true
          )

          echo "Comparing playlists..."

          if [ -n "$PUBLIC_CONTENT" ] && cmp -s playlist.m3u <(printf '%s' "$PUBLIC_CONTENT"); then
            echo "Playlist has not changed."
            echo "Nothing to publish."
            exit 0
          fi

          echo "Playlist has changed. Publishing new version..."

          CONTENT=$(base64 -w 0 playlist.m3u)

          if [ -n "$SHA" ]; then
            echo "Updating existing playlist..."

            curl -fsSL \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "{\"message\":\"Update playlist\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          else
            echo "Creating playlist..."

            curl -fsSL \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "{\"message\":\"Publish playlist\",\"content\":\"$CONTENT\"}"
          fi

          echo "Playlist published successfully."
