name: Publish IPTV Playlist

on:
  workflow_dispatch:

# Không hủy lần publish đang chạy.
concurrency:
  group: publish-iptv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ==========================================
      # CHECKOUT PRIVATE REPOSITORY
      # ==========================================
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # ==========================================
      # VALIDATE PLAYLIST
      # ==========================================
      - name: Validate playlist
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VALIDATE PLAYLIST"
          echo "======================================"

          if [[ ! -f playlist.m3u ]]; then
            echo "ERROR: playlist.m3u not found"
            exit 1
          fi

          if ! grep -q '^#EXTM3U' playlist.m3u; then
            echo "ERROR: Invalid M3U playlist"
            exit 1
          fi

          CHANNEL_COUNT=$(grep -c '^#EXTINF:' playlist.m3u || true)

          echo "Channels: $CHANNEL_COUNT"

          if (( CHANNEL_COUNT < 1 )); then
            echo "ERROR: Playlist contains no channels"
            exit 1
          fi

          echo "Playlist size:"
          ls -lh playlist.m3u

          echo "Playlist validation: OK"

      # ==========================================
      # PUBLISH TO PUBLIC REPOSITORY
      # ==========================================
      - name: Publish playlist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PUBLISH IPTV PLAYLIST"
          echo "======================================"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "ERROR: PUBLISH_TOKEN is not configured"
            exit 1
          fi

          API="https://api.github.com/repos/csev7n/xoilacz-iptv/contents/playlist.m3u"

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          META="$TMP_DIR/metadata.json"
          PUBLIC_FILE="$TMP_DIR/public.m3u"
          CONTENT_FILE="$TMP_DIR/content.b64"
          PAYLOAD="$TMP_DIR/payload.json"
          RESPONSE_FILE="$TMP_DIR/response.json"

          # Encode playlist into a file instead of a large shell variable.
          base64 -w 0 playlist.m3u > "$CONTENT_FILE"

          MAX_ATTEMPTS=3

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo ""
            echo "======================================"
            echo "PUBLISH ATTEMPT $ATTEMPT/$MAX_ATTEMPTS"
            echo "======================================"

            echo "Getting current public playlist..."

            if ! META_CODE=$(curl -sS \
              --connect-timeout 15 \
              --max-time 60 \
              -o "$META" \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API"); then
              echo "ERROR: Failed to contact GitHub API"
              exit 1
            fi

            SHA=""
            DOWNLOAD_URL=""

            if [[ "$META_CODE" == "200" ]]; then
              SHA=$(jq -r '.sha // empty' "$META")
              DOWNLOAD_URL=$(jq -r '.download_url // empty' "$META")

              if [[ -z "$SHA" || -z "$DOWNLOAD_URL" ]]; then
                echo "ERROR: Missing file SHA or download URL"
                jq '{message, status}' "$META" 2>/dev/null || true
                exit 1
              fi

              echo "Downloading current public playlist..."

              if ! curl -fsSL \
                --connect-timeout 15 \
                --max-time 60 \
                --retry 3 \
                --retry-delay 2 \
                "$DOWNLOAD_URL" \
                -o "$PUBLIC_FILE"; then
                echo "ERROR: Failed to download public playlist"
                exit 1
              fi

              echo "Comparing playlists..."

              if cmp -s playlist.m3u "$PUBLIC_FILE"; then
                echo "Playlist has not changed."
                echo "Nothing to publish."
                exit 0
              fi

              echo "Playlist has changed."
              echo "Updating existing playlist..."

            elif [[ "$META_CODE" == "404" ]]; then
              echo "Public playlist does not exist."
              echo "Creating new playlist..."

            else
              echo "ERROR: Failed to read public repository."
              echo "GitHub API status: $META_CODE"
              jq '{message, status}' "$META" 2>/dev/null || true
              exit 1
            fi

            # Build a valid JSON request using files.
            jq -n \
              --rawfile content "$CONTENT_FILE" \
              --arg message "Update IPTV playlist" \
              '{
                message: $message,
                content: ($content | gsub("[\r\n]"; ""))
              }' > "$PAYLOAD"

            # Existing files require their current SHA.
            if [[ -n "$SHA" ]]; then
              jq --arg sha "$SHA" \
                '. + {sha: $sha}' \
                "$PAYLOAD" > "$TMP_DIR/payload-next.json"

              mv "$TMP_DIR/payload-next.json" "$PAYLOAD"
            fi

            # Validate JSON before uploading.
            if ! jq -e '
              type == "object" and
              (.message | type == "string") and
              (.content | type == "string") and
              (.content | length > 0) and
              ((has("sha") | not) or (.sha | type == "string"))
            ' "$PAYLOAD" > /dev/null; then
              echo "ERROR: Invalid GitHub API payload"
              exit 1
            fi

            echo "Uploading playlist..."

            if ! HTTP_CODE=$(curl -sS \
              --connect-timeout 15 \
              --max-time 120 \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data-binary "@$PAYLOAD" \
              "$API"); then
              echo "ERROR: Upload connection failed."
              echo "Check the public repository before rerunning."
              exit 1
            fi

            echo "GitHub API status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "201" ]]; then
              echo ""
              echo "======================================"
              echo "PUBLISH SUCCESS"
              echo "======================================"

              echo "Public repository:"
              echo "https://github.com/csev7n/xoilacz-iptv"

              echo "Playlist published successfully."
              exit 0
            fi

            # Refresh metadata and SHA on the next attempt.
            # Do not blindly retry other API errors.
            if [[ "$HTTP_CODE" == "409" || "$HTTP_CODE" == "422" ]]; then
              echo "Publish conflict or validation error."

              if (( ATTEMPT < MAX_ATTEMPTS )); then
                echo "Rechecking latest playlist and SHA..."
                sleep 2
                continue
              fi
            fi

            echo "ERROR: Failed to publish playlist."

            jq '{
              message,
              status,
              documentation_url,
              errors
            }' "$RESPONSE_FILE" 2>/dev/null ||
              cat "$RESPONSE_FILE"

            exit 1
          done

          echo "ERROR: Publish failed after all attempts."
          exit 1
