name: Publish IPTV Playlist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT PRIVATE REPOSITORY
      # ==================================================

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==================================================
      # CHECK PLAYLIST
      # ==================================================

      - name: Check playlist
        run: |
          echo "======================================"
          echo "CHECK PLAYLIST"
          echo "======================================"

          if [ ! -f playlist.m3u ]; then
            echo "ERROR: playlist.m3u not found"
            exit 1
          fi

          ls -lh playlist.m3u


      # ==================================================
      # PUBLISH TO PUBLIC REPOSITORY
      # ==================================================

      - name: Publish playlist
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/csev7n/xoilacz-iptv/contents/playlist.m3u"

          echo "======================================"
          echo "GET CURRENT PUBLIC PLAYLIST"
          echo "======================================"

          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")

          SHA=$(echo "$RESPONSE" | jq -r '.sha // empty')

          PUBLIC_CONTENT=$(
            echo "$RESPONSE" |
            jq -r '.content // empty' |
            tr -d '\n' |
            base64 -d 2>/dev/null || true
          )

          echo "======================================"
          echo "COMPARE PLAYLIST"
          echo "======================================"

          if [ -n "$PUBLIC_CONTENT" ] && \
             cmp -s playlist.m3u <(printf '%s' "$PUBLIC_CONTENT"); then

            echo "Playlist has not changed."
            echo "Nothing to publish."

            exit 0
          fi

          echo "Playlist has changed."
          echo "Publishing new version..."


          # ==================================================
          # ENCODE PLAYLIST
          # ==================================================

          CONTENT=$(base64 -w 0 playlist.m3u)


          # ==================================================
          # UPDATE PUBLIC REPOSITORY
          # ==================================================

          if [ -n "$SHA" ]; then

            echo "Updating existing playlist..."

            curl -fsSL \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "{\"message\":\"Update playlist\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"

          else

            echo "Creating playlist..."

            curl -fsSL \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "{\"message\":\"Publish playlist\",\"content\":\"$CONTENT\"}"

          fi


          echo ""
          echo "======================================"
          echo "PUBLISH SUCCESS"
          echo "======================================"

          echo "Playlist published successfully."
