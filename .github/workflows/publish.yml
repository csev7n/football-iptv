name: Publish IPTV Playlist

on:
  workflow_dispatch:

# ==================================================
# CONCURRENCY
# ==================================================
# Không hủy publish đang chạy.
concurrency:
  group: publish-iptv
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  publish:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ==================================================
      # CHECKOUT PRIVATE REPOSITORY
      # ==================================================

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==================================================
      # CHECK PLAYLIST
      # ==================================================

      - name: Validate playlist
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VALIDATE PLAYLIST"
          echo "======================================"

          if [ ! -f playlist.m3u ]; then
            echo "ERROR: playlist.m3u not found"
            exit 1
          fi

          if ! grep -q '^#EXTM3U' playlist.m3u; then
            echo "ERROR: Invalid M3U playlist"
            exit 1
          fi

          CHANNEL_COUNT=$(grep -c '^#EXTINF:' playlist.m3u || true)

          echo "Channels: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -lt 1 ]; then
            echo "ERROR: Playlist contains 0 channels"
            exit 1
          fi

          echo ""
          echo "Playlist size:"
          ls -lh playlist.m3u

          echo ""
          echo "Playlist validation: OK"

      # ==================================================
      # PUBLISH TO PUBLIC REPOSITORY
      # ==================================================

      - name: Publish playlist
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PUBLISH IPTV PLAYLIST"
          echo "======================================"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: PUBLISH_TOKEN is not configured"
            exit 1
          fi

          API="https://api.github.com/repos/csev7n/xoilacz-iptv/contents/playlist.m3u"

          echo ""
          echo "Getting current public playlist..."

          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")

          SHA=$(echo "$RESPONSE" | jq -r '.sha // empty')

          PUBLIC_CONTENT=$(
            echo "$RESPONSE" |
            jq -r '.content // empty' |
            tr -d '\n' |
            base64 -d 2>/dev/null || true
          )

          echo ""
          echo "Comparing playlists..."

          if [ -n "$PUBLIC_CONTENT" ] && \
             cmp -s playlist.m3u <(printf '%s' "$PUBLIC_CONTENT"); then

            echo "Playlist has not changed."
            echo "Nothing to publish."

            exit 0
          fi

          echo "Playlist has changed."
          echo "Publishing new version..."

          # ==================================================
          # ENCODE
          # ==================================================

          CONTENT=$(base64 -w 0 playlist.m3u)

          # ==================================================
          # UPDATE EXISTING FILE
          # ==================================================

          if [ -n "$SHA" ]; then

            echo "Updating existing playlist..."

            RESPONSE=$(curl -sS \
              -w "\n%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "$(jq -n \
                --arg message "Update playlist" \
                --arg content "$CONTENT" \
                --arg sha "$SHA" \
                '{
                  message: $message,
                  content: $content,
                  sha: $sha
                }'
              )")

          else

            echo "Creating playlist..."

            RESPONSE=$(curl -sS \
              -w "\n%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "$(jq -n \
                --arg message "Publish playlist" \
                --arg content "$CONTENT" \
                '{
                  message: $message,
                  content: $content
                }'
              )")

          fi

          # ==================================================
          # CHECK API RESPONSE
          # ==================================================

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo ""
          echo "GitHub API status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && \
             [ "$HTTP_CODE" != "201" ]; then

            echo ""
            echo "ERROR: Failed to publish playlist."
            echo "$BODY"

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "PUBLISH SUCCESS"
          echo "======================================"

          echo "Public repository:"
          echo "https://github.com/csev7n/xoilacz-iptv"

          echo ""
          echo "Playlist published successfully."
